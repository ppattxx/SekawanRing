name: Build and Push Frontend

on:
  push:
    branches:
      - production

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sekawan-frontend:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: deploy
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /srv/sekawan
            # Update variabel tag agar docker-compose tahu versi mana yang dipakai
            export FRONTEND_TAG=${{ github.sha }}

            # Tarik image terbaru
            docker compose pull frontend

            # Jalankan/Update kontainer frontend saja tanpa mengganggu backend
            docker compose up -d frontend

            # Bersihkan image lama agar disk VPS tidak penuh
            docker image prune -f
